services:

  db:
    image: postgres:16
    container_name: creditiq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creditiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: creditiq-api
    restart: unless-stopped
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: creditiq
    ports:
      - "8000:8000"
    depends_on:
      - db

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: creditiq-dashboard
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: creditiq-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"

volumes:
  postgres_data: