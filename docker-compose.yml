services:

  db:
    image: postgres:16
    container_name: creditiq-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    # PostgreSQL is intentionally NOT exposed to the host.
    # API and other services access it internally through:
    # db:5432


  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api

    container_name: creditiq-api
    restart: unless-stopped

    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      MLFLOW_TRACKING_URI: http://mlflow:5000

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy


  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard

    container_name: creditiq-dashboard
    restart: unless-stopped

    environment:
      API_URL: http://api:8000

    ports:
      - "8501:8501"

    depends_on:
      api:
        condition: service_started


  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: creditiq-mlflow
    restart: unless-stopped

    ports:
      - "5000:5000"

    volumes:
      - mlflow_data:/mlruns

    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:///mlruns/mlflow.db
      - --default-artifact-root
      - /mlruns


volumes:
  postgres_data:
  mlflow_data: