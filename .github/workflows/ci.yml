name: CreditIQ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: creditiq
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          pytest -q

  docker-build:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build \
            -f docker/Dockerfile.api \
            -t creditiq-api:test .

      - name: Build dashboard image
        run: |
          docker build \
            -f docker/Dockerfile.dashboard \
            -t creditiq-dashboard:test .